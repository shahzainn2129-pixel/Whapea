  if(c.type==='dm'&&reach(c.cid)==='none'&&0){}
  const v=document.createElement('div');v.className='screen';v.id='chatv';
  v.innerHTML=`<div class="ch" id="chh"></div><div class="msgs" id="msgs"></div><div id="aux"></div><div class="comp" id="comp"></div>`;
  phone.append(v);applyWp($('#msgs'),c);drawHead();drawMsgs(true);drawComp();render();
  if(NATIVE&&c.type==='dm')peerSeen(c.cid);
  if(NATIVE)sendReads(c);else if(SET.receipts)c.msgs.forEach(m=>{if(m.from!=='me'&&m.status!=='read')m.status='read'});
}
function closeChat(){S.chat=null;S.rec&&clearInterval(S.rec.iv);S.rec=null;$('#chatv')?.remove();render()}
function drawHead(){
  const c=chatOf(S.chat);if(!c)return;const r=chatReach(c);
  let sub;if(c.typing)sub=`<small class="live">${c.type==='dm'?'':esc(c.typing)+' '}typing…</small>`;
  else if(NATIVE&&c.type==='dm'&&isNet(c.cid)){const q=P[c.cid],sc=q.ls==null||!SET.online?null:q.ls+(Date.now()-(q.lsAt||Date.now()))/1000;sub=sc==null?'<small></small>':sc<100?'<small class="live">online</small>':`<small>last seen ${seenTxt(sc)}</small>`}
  else if(c.type==='group')sub=`<small>${c.members.map(m=>P[m].name.split(' ')[0]).join(', ')}, You</small>`;
  else sub='<small></small>';
  $('#chh').innerHTML=`<button class="ib" data-a="closeChat" aria-label="Back">${ic('back')}</button>${av(cHue(c),cName(c),'sm')}<button class="who" data-a="chatInfo"><b>${esc(cName(c))}${c.type==='dm'&&P[c.cid]?bdg(P[c.cid].plan):''}</b>${sub}</button>${c.type==='dm'?`${NATIVE&&isNet(c.cid)?`<button class="ib" data-a="startVideo" data-v="${c.cid}" aria-label="Video call">${ic('video',21)}</button>`:''}<button class="ib" data-a="startCall" data-v="${c.cid}" aria-label="Voice call">${ic('phone',21)}</button>`:(c.type==='group'&&NATIVE&&NET.s&&c.members.some(isNet)?`<button class="ib" data-a="gcStart" data-v="${esc(c.id)}|1" aria-label="Group video call">${ic('video',21)}</button><button class="ib" data-a="gcStart" data-v="${esc(c.id)}|0" aria-label="Group voice call">${ic('phone',21)}</button>`:'')}<button class="ib" data-a="chatMenu" aria-label="More">${ic('more')}</button>`;
}
const hl=t=>esc(t).replace(/@(\w+)/g,'<span class="mention">@$1</span>');
function msgHTML(c,m,i){
  const own=m.from==='me',g=c.type==='group';
  let body='';
  if(m.deleted)body=`<div class="gone">${ic('ban',15)} ${own?'You deleted this message':'This message was deleted'}</div>`;
  else{
    if(m.type==='text'){body=`<span class="tt">${hl(m.text)}</span>`}
    if(m.type==='voice'){const on=S.playing===m.id;body=`<div class="voice"><button class="pp" data-a="play" data-v="${m.id}" aria-label="Play">${ic(on?'pause':'play',18)}</button><div class="wave">${[...Array(26)].map((_,k)=>`<i class="${on&&k<S.pp?'on':''}" style="height:${6+((k*7+m.dur*3)%19)}px"></i>`).join('')}</div><small>${dur(on?Math.round(m.dur*S.pp/26):m.dur)}</small>${on?`<button class="spd" data-a="rate" data-v="">${S.rate||1}x</button>`:''}</div>`}
    if(m.type==='img')body=`<img class="img" data-a="openMedia" data-v="${m.id}" src="${m.src}" alt="Photo">${m.text?hl(m.text):''}`;
    if(m.type==='video')body=`<div class="vid" data-a="openMedia" data-v="${m.id}"><video src="${m.src}#t=0.2" preload="metadata" muted playsinline></video><span class="vp">${ic('play',30)}</span>${m.dur?`<small>${dur(m.dur)}</small>`:''}</div>${m.text?hl(m.text):''}`;
    if(m.type==='file'||m.type==='audio')body=`<div class="filec"><span class="fi">${ic(m.type==='audio'?'music':'file',20)}</span><span style="min-width:0"><b style="font-weight:600">${esc(m.name)}</b><small>${esc(m.size)}</small></span>${m.src?`<button class="fdl" data-a="openFile" data-v="${m.id}" aria-label="Save to Downloads">${ic('down',18)}</button>`:''}</div>${m.type==='audio'&&m.src?`<audio controls preload="none" src="${esc(m.src)}" style="width:100%;margin-top:6px;height:34px"></audio>`:''}`;
    if(m.once&&(m.type==='img'||m.type==='video'))body=onceHTML(m);
    else if(m.type==='img'&&m.from==='me'&&window.upRing)body+=upRing(m);
    if(m.type==='contact')body=`<div class="filec"><span class="fi">${ic('user',20)}</span><span><b style="font-weight:600">${esc(m.name)}</b><small>Shared contact</small></span></div>`;
    if(m.type==='loc')body=isFinite(m.lat)?`<div class="filec"><span class="fi">${ic('loc',20)}</span><span style="min-width:0"><b style="font-weight:600">Location</b><small>${m.lat.toFixed(4)}, ${m.lng.toFixed(4)}</small></span></div><button class="locb" data-a="openLoc" data-v="${m.id}">Open in Maps</button>`:`<div class="loc">${ic('loc',34)}</div>${esc(m.text)}`;
    if(m.type==='poll'){const tot=m.opts.reduce((a,o)=>a+o.v.length,0);body=`<div class="poll"><b>${ic('poll',16)} ${esc(m.q)}</b>${m.opts.map((o,k)=>`<button class="opt ${o.v.includes('me')?'me':''}" data-a="vote" data-v="${m.id}:${k}"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span><span>${esc(o.t)}</span><span>${o.v.length}</span></span></button>`).join('')}</div>`}
  }
  const q=m.reply?`<div class="quote"><b>${esc(m.reply.who)}</b>${esc(m.reply.text)}</div>`:'';
  const rx=Object.entries(m.rx||{}).map(([e,n])=>`<span>${e}${n>1?' '+n:''}</span>`).join('');
  return `<div class="mrow ${own?'out':'in'}${(Date.now()-m.t<800&&!POPD.has(m.id)&&POPD.add(m.id))?' pop':''}" style="--h:${own?0:P[m.from].hue}"><div class="b${m.type==='text'&&!m.deleted?' tx'+((m.text||'').length<=26&&!/\n/.test(m.text||'')?' ts':''):''}" style="--mw:${(own?80:62)+(m.edited?44:0)+(m.star?14:0)+(c.disap?14:0)}px" role="button" tabindex="0" data-a="msg" data-v="${m.id}">${g&&!own?`<div class="who">${esc(P[m.from].name)}</div>`:''}${m.fwd?`<div class="fwd">${ic('fwd',13)} Forwarded</div>`:''}${q}${body}<span class="meta">${m.star?ic('star',12):''}${m.edited&&!m.deleted?'edited':''}${c.disap?ic('timer',12):''}${fmt(m.t)}${own?tick(m):''}</span></div>${rx?`<div class="rx">${rx}</div>`:''}</div>`}
const pinTxt=m=>m.type==='text'?m.text:({voice:'Voice message',img:'Photo',video:'Video',file:'File',loc:'Location',poll:'Poll'})[m.type]||'Message';
function dayLbl(a,m){const d=new Date(m.t),k=x=>new Date(x).toDateString();if(a&&k(a.t)===k(m.t))return '';const t=new Date(),y=new Date(Date.now()-864e5);const l=k(m.t)===k(t)?'Today':k(m.t)===k(y)?'Yesterday':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()===t.getFullYear()?undefined:'numeric'});return `<div class="dlbl"><span>${l}</span></div>`}
const POPD=new Set();
function drawMsgs(scroll){
  const c=chatOf(S.chat);if(!c)return;const el=$('#msgs');if(!el)return;
  const q=c.find?c.find.toLowerCase():'';
  let list=c.msgs.filter(m=>!q||(m.text||'').toLowerCase().includes(q));const lim=c._lim||120,more=list.length>lim;if(more)list=list.slice(-lim);
  const nearBottom=el.scrollHeight-el.scrollTop-el.clientHeight<120;
  el.innerHTML=(NATIVE&&c.type==='dm'&&isNet(c.cid)?`<button class="note" data-a="cm_sec" data-v="${esc(c.id)}">${ic('lock',14)}<span>Messages and calls are end-to-end encrypted. Only you and ${esc(P[c.cid].name)} can read or hear them. Tap to learn more.</span></button>`:'')+(c.disap?`<div class="note">${ic('lock',14)}<span>Disappearing messages: ${({24:'24 hours',168:'7 days',2160:'90 days'})[c.disap]}.</span></div>`:'')+
   (c.pin&&c.msgs.find(x=>x.id===c.pin&&!x.deleted)?`<div class="pinb" data-a="goPin">${ic('star',15)}<span>${esc(pinTxt(c.msgs.find(x=>x.id===c.pin)))}</span></div>`:'')+(more?`<button class="earlier" data-a="earlier">Load earlier messages</button>`:'')+list.map((m,i)=>dayLbl(list[i-1],m)+msgHTML(c,m,i)).join('')+(c.typing?`<div class="typing"><i></i><i></i><i></i></div>`:'');
  if(scroll||nearBottom)el.scrollTop=el.scrollHeight;
}
function drawComp(){
  const c=chatOf(S.chat);if(!c)return;const comp=$('#comp'),aux=$('#aux');
  aux.innerHTML=(S.reply?`<div class="banner">${ic('reply',18)}<div><b>Replying to ${esc(S.reply.who)}</b>${esc(S.reply.text)}</div><button class="ib" data-a="cancelAux" aria-label="Cancel">${ic('x',18)}</button></div>`:'')+(S.edit?`<div class="banner">${ic('edit',18)}<div><b>Editing message</b>${esc(S.edit.text)}</div><button class="ib" data-a="cancelAux" aria-label="Cancel">${ic('x',18)}</button></div>`:'')+(S.emo?`<div class="emo">${EMO.map(e=>`<button data-a="emoji" data-v="${e}">${e}</button>`).join('')}</div>`:'');
  if(c.blocked){comp.innerHTML=`<div class="rec" style="color:var(--muted);justify-content:center;font-weight:500">You blocked this contact. <button style="color:var(--accent);font-weight:600" data-a="unblock">Unblock</button></div>`;return}
  if(S.rec){comp.innerHTML=`<button class="ib" data-a="recCancel" aria-label="Cancel" style="color:var(--bad)">${ic('trash')}</button><div class="rec"><span>●</span><span id="rt">0:00</span><div class="wave" id="lw">${[...Array(24)].map(()=>`<i style="height:4px"></i>`).join('')}</div></div><button class="ib pri" data-a="recSend" aria-label="Send voice message">${ic('send',20)}</button>`;return}
  const keep=$('#msgIn')?.value||(S.edit?S.edit.text:'');
  comp.innerHTML=`<button class="ib" data-a="attach" aria-label="Attach">${ic('clip')}</button><div class="inp"><button class="ib" data-a="emoTog" aria-label="Emoji" style="width:36px;height:40px">${ic('smile',22)}</button><textarea id="msgIn" rows="1" placeholder="Message" aria-label="Message"></textarea></div><button class="ib pri" id="sendBtn" data-a="send" aria-label="Send">${ic('send',20)}</button><button class="ib pri" id="micBtn" data-a="recStart" aria-label="Record voice message">${ic('mic',20)}</button>`;
  const ta=$('#msgIn');ta.value=keep;syncSend();
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';syncSend();if(ta.value.trim())typSend()});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&SET.enter){e.preventDefault();ACT.send()}});
}
function syncSend(){const v=($('#msgIn')?.value||'').trim();const s=$('#sendBtn'),m=$('#micBtn');if(s&&m){s.hidden=!v;m.hidden=!!v}}

/* ---------- sending and simulated delivery ---------- */
function appendMsg(c,m){const el=$('#msgs');
  if(!el||!S.chat||S.chat!==c.id||c.find){drawMsgs(true);if(!S.chat)render();return}
  el.querySelector('.typing')?.remove();
  el.insertAdjacentHTML('beforeend',msgHTML(c,m,c.msgs.length-1)+(c.typing?'<div class="typing"><i></i><i></i><i></i></div>':''));el.scrollTop=el.scrollHeight}
function pushMsg(c,m){
  m.status=chatReach(c)==='none'?'queued':'sent';c.msgs.push(m);c.pinned&&0;
  appendMsg(c,m);
  if(m.status!=='queued')deliver(c,m);
}
function deliver(c,m){
  const slow=chatReach(c)==='relay'?1300:0;
  sleep(()=>{m.status='delivered';m.tD=Date.now();refresh()},650+slow);
  sleep(()=>{if(SET.receipts){m.status='read';m.tR=Date.now();refresh()}
    if(m.type==='text'||m.type==='voice'||m.type==='img')replyLater(c)},1700+slow);
}
function replyLater(c){
  if(Math.random()<.25)return;const who=c.type==='group'?c.members.filter(x=>reach(x)!=='none')[0]:c.cid;if(!who)return;
  sleep(()=>{c.typing=P[who].name.split(' ')[0];refresh()},500);
  sleep(()=>{c.typing=null;c.msgs.push(M(who,REPLIES[Math.floor(Math.random()*REPLIES.length)],0,{t:Date.now(),status:'read'}));
    if(S.chat!==c.id){c.unread++;if(SET.notif)toast(P[who].name.split(' ')[0]+': '+prev(last(c)))}refresh()},2300);
}
let _rfq=0;function refresh(){if(_rfq)return;_rfq=requestAnimationFrame(()=>{_rfq=0;if(S.chat){drawHead();drawMsgs(false)}else render()})}
function flushQueue(cid){chats.forEach(c=>{if(chatReach(c)!=='none')c.msgs.forEach(m=>{if(m.from==='me'&&m.status==='queued'){m.status='sent';deliver(c,m)}})});refresh()}

/* ---------- v4.9 swipe gestures ---------- */
(()=>{let t=null;const W=210;
 const closeAll=ex=>document.querySelectorAll('.srw>.li').forEach(l=>{if(l!==ex&&l.style.transform){l.style.transform='';l._open=false}});
 document.addEventListener('touchstart',e=>{const x=e.touches[0],li=e.target.closest('.srw>.li'),mb=e.target.closest('.mrow .b');
  if(!li)closeAll();
  t=li?{k:'c',el:li,x:x.clientX,y:x.clientY,base:li._open?-W:0}:mb?{k:'m',el:mb.closest('.mrow'),b:mb,x:x.clientX,y:x.clientY,base:0}:null;if(t)t.on=false},{passive:true});
 document.addEventListener('touchmove',e=>{if(!t)return;const x=e.touches[0],dx=x.clientX-t.x,dy=x.clientY-t.y;
  if(!t.on){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){t=null;return}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){t.on=true;t.el.style.transition='none'}else return}
  if(t.k==='c'){const v=Math.max(-W,Math.min(0,t.base+dx));t.el.style.transform='translateX('+v+'px)'}
  else{const v=Math.max(0,Math.min(70,dx));t.el.style.transform='translateX('+v+'px)'}},{passive:true});
 document.addEventListener('touchend',e=>{if(!t)return;const x=e.changedTouches[0],dx=x.clientX-t.x,T=t;t=null;if(!T.on)return;T.el.style.transition='';
  if(T.k==='c'){const open=(T.base+dx)<-W/2;T.el.style.transform=open?'translateX('+(-W)+'px)':'';T.el._open=open;T.el._lp=true;setTimeout(()=>{T.el._lp=false},350)}
  else{T.el.style.transform='';if(dx>55){const id=T.b.dataset.v;if(id&&ACT.replyTo){try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}ACT.replyTo(id)}}}},{passive:true});
})();

/* resend what never left the phone (receivers ignore a message id they already have) */
function resendStuck(){if(!NATIVE||!NET.s)return;const lim=Date.now()-48*36e5;
  chats.forEach(c=>{if(c.type!=='dm'||!isNet(c.cid))return;let n=0;
    c.msgs.forEach(m=>{if(m.from==='me'&&!m.deleted&&m.status==='sent'&&m.t>lim&&Date.now()-m.t>60000&&n<20){n++;sendMsg(c,m)}})})}
setTimeout(resendStuck,12000);
setInterval(()=>{if(NET.s&&navigator.onLine)netFlush()},15000);

/* say why a message is not leaving */
const _dc2=drawComp;
drawComp=function(){_dc2.apply(this,arguments);try{const c=chatOf(S.chat);if(!c||c.req||c.type!=='dm')return;const e=NET.err;
  if(!e||Date.now()-e.t>180000)return;if(!c.msgs.some(m=>m.from==='me'&&m.status==='queued'))return;const comp=$('#comp');if(!comp||comp.querySelector('.sendwarn'))return;
  comp.insertAdjacentHTML('afterbegin','<div class="sendwarn" data-a="retryAll">Not sent: '+esc(e.r)+'. Tap to try again</div>')}catch(x){}};
ACT.retryAll=()=>{NET.err=null;netFlush();toast('Trying again');drawComp()};
const st=document.createElement('style');st.textContent='.sendwarn{width:100%;font-size:12px;padding:6px 12px;text-align:center;background:var(--surface2);color:var(--ink);border-radius:10px;margin-bottom:6px}';document.head.append(st);
})();


/* ===== v8.1 design: full-screen sign up and log in ===== */
(()=>{
const css=document.createElement('style');css.textContent=`
.scrim.authpg{background:#050505;align-items:stretch;justify-content:stretch;padding:0}
.authpg .sheet{position:absolute;inset:0;width:100%;max-width:none;max-height:none;height:100%;border-radius:0;box-shadow:none;overflow-y:auto;color:#fff;padding:40px 24px 22px;background:radial-gradient(circle at 15% -5%,rgba(255,255,255,.16),rgba(255,255,255,0) 45%),#050505;display:flex;flex-direction:column}

.authpg .aps{margin-top:8px;font-size:13px;line-height:1.5;color:#a3a3a3}
.authpg .field{display:flex;align-items:center;gap:10px;height:50px;margin:12px 0 0;padding:0 14px;border:1.2px solid #2e2e2e;background:#101010;border-radius:14px;color:#8a8a8a}
.authpg .field:focus-within{border-color:#fff;color:#fff}
.authpg .field input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:#fff;font-size:14px;padding:0}
.authpg .field svg{width:19px;height:19px;flex:none}
.authpg .apeye{width:30px;height:30px;display:grid;place-items:center;color:inherit;flex:none}
.authpg .aph2{font-size:11.5px;color:#777;margin:6px 4px 0}
.authpg .btn{height:52px;border-radius:26px;font-size:15px;font-weight:700;margin:16px 0 0;width:100%;box-sizing:border-box}
.authpg .btn:not([style]){background:#fff;color:#000}
.authpg .btn[style]{background:transparent!important;color:#fff!important;border:1.2px solid #3a3a3a!important;height:50px;margin:12px 0 0;font-size:14px;font-weight:600}
.authpg .note2{margin-top:auto;padding-top:16px;text-align:center;font-size:11.5px;color:#8a8a8a}
.authpg .tag{color:#aaa!important;font-size:13px}`;document.head.append(css);
const MAIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>';
function skin(s,up){const sh=s.querySelector('.sheet');if(!sh)return;s.classList.add('authpg');
  const h3=sh.querySelector('h3');if(h3)h3.remove();const g=sh.querySelector('.grab');if(g)g.remove();
  sh.insertAdjacentHTML('afterbegin',`<button class="apx" type="button" aria-label="Close">${ic('x',18)}</button><div class="aph"><span class="aplg">${WLOGO}</span><b>VYNK</b></div><h2 class="apt">${up?'Create your account,<br>start chatting.':'Welcome back.'}</h2><p class="aps">${up?'It takes a minute. Your chats are end-to-end encrypted.':'Log in to continue your chats.'}</p>`);
  sh.querySelector('.apx').onclick=()=>closeSheet();
  const icon={ne:MAIL,nu:ic('user',19),np:ic('lock',19)};
  sh.querySelectorAll('.field').forEach(f=>{const i=f.querySelector('input');if(!i)return;f.insertAdjacentHTML('afterbegin',icon[i.id]||'');
    if(i.id==='ne')i.placeholder=up?'Email':'Email or username';
    if(i.id==='nu'){i.placeholder='Username';f.insertAdjacentHTML('afterend','<div class="aph2">Friends find you by this username.</div>')}
    if(i.id==='np'){i.placeholder='Password';if(up)f.insertAdjacentHTML('afterend','<div class="aph2">At least 6 characters.</div>');
      f.insertAdjacentHTML('beforeend',`<button class="apeye" type="button" aria-label="Show password">${ic('eye',19)}</button>`);
      f.querySelector('.apeye').onclick=e=>{e.preventDefault();i.type=i.type==='password'?'text':'password'}}});
}
const _sheet=sheet;
sheet=function(title,html){const s=_sheet.apply(this,arguments);try{if(title==='Create account'||title==='Log in')skin(s,title==='Create account')}catch(e){}return s};
})();


/* ===== Ads / Promote ===== */
if(!I.flag)I.flag='<path d="M5 21V4m0 0h12l-2 4 2 4H5"/>';
if(!I.megaphone)I.megaphone='<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>';
if(!I.link)I.link='<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>';
if(!I.copy)I.copy='<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>';
let ADS=[],adT=0;const adSeen=new Set();
async function adLoad(force){if(!NET.s||(!force&&Date.now()-adT<60000))return;adT=Date.now();try{const a=await rpc('ad_feed');ADS=Array.isArray(a)?a:[];if(S.tab==='status'&&!S.chat&&!document.querySelector('.scrim')){const b=$('#body');if(b)b.innerHTML=(document.documentElement.classList.contains('vk')?statusVk():statusHTML())}}catch(e){}}
function adCard(a,prev){const ini=esc(((a.uname||'?')[0]||'?').toUpperCase());
  return `<div class="adc"><div class="adh"><span class="ada">${ini}</span><span class="adw"><b>${esc(a.uname?'@'+a.uname:'Your name')}${a.plan?bdg(a.plan==='gold'?'gold':'plus'):''}</b><small>Sponsored</small></span>${prev?'':`<button class="adx" data-a="adRep" data-v="${a.id}" aria-label="Report ad">${ic('flag',17)}</button>`}</div>${okImg(a.img)?`<img class="adi" src="${a.img}" alt="">`:''}<div class="adbd"><h4>${esc(a.title)}</h4><p>${esc(a.body)}</p></div>${a.link||prev?`<button class="adb" ${prev?'':`data-a="adGo" data-v="${a.id}"`}>Learn more</button>`:''}</div>`}
function adsHTML(){adLoad();ADS.forEach(a=>{if(!adSeen.has(a.id)){adSeen.add(a.id);rpc('ad_event',{p_id:a.id,p_kind:'view'}).catch(()=>{})}});
  return `<div class="adsec">${ADS.map(a=>adCard(a)).join('')}${NET.s?`<button class="adpr" data-a="adNew"><span class="adpi">${ic('megaphone',22)}</span><span class="adpt"><b>Grow with Vynk Ads</b><small>Show your business to Vynk users. First ad is free every week.</small></span><span class="adpg">Promote</span></button>`:''}</div>`}
function adPage(inner){const el=sheet('','');el.classList.add('authpg');const sh=el.querySelector('.sheet');sh.innerHTML=`<button class="apx" type="button" aria-label="Close">${ic('x',18)}</button>${inner}`;sh.querySelector('.apx').onclick=()=>closeSheet();return el}
function adPrev(){const e=$('#adpv');if(!e)return;const g=i=>(($(i)||{}).value||'').trim();e.innerHTML=adCard({uname:NET.s.user,plan:ME.plan,title:g('#adt')||'Your title appears here',body:g('#adb')||'Write a short description so people know what you offer.',link:g('#adl')||'x',img:AD.img},true)}
function adTotal(){const e=$('#adtot');if(!e)return;if(AD.free){e.textContent='Free';return}const d=+(($('#add')||{}).value||1),n=parseInt(String(AD.price).replace(/,/g,'').match(/\d+/)||[0]);e.textContent=n?('PKR '+(n*d).toLocaleString()):AD.price}
document.addEventListener('input',e=>{if(/^ad[tbl]$/.test(e.target.id))adPrev()});document.addEventListener('change',e=>{if(e.target.id==='add')adTotal()});
Object.assign(ACT,{
 adGo:v=>{const a=ADS.find(x=>String(x.id)===String(v));if(!a||!a.link)return;rpc('ad_event',{p_id:a.id,p_kind:'click'}).catch(()=>{});openUrl(a.link)},
 adRep:async v=>{try{await rpc('ad_event',{p_id:+v,p_kind:'report'});ADS=ADS.filter(x=>String(x.id)!==String(v));toast('Thanks. We will review this ad');render()}catch(e){toast('Failed')}},
 adNew:async()=>{if(!NET.s){ACT.netAcct();return}closeSheet();let price='PKR 100 per day',info='';try{const r=await sb('/rest/v1/app_config?select=key,value');(await r.json()).forEach(x=>{if(x.key==='ad_price')price=x.value;if(x.key==='pay_info')info=x.value})}catch(e){}
  AD={img:'',free:true,price,num:(String(info).match(/0\d{10}/)||[''])[0]};
  adPage(`<div class="aph"><span class="aplg">${WLOGO}</span><b>VYNK ADS</b></div><h2 class="apt">Promote on Vynk</h2><p class="aps">Your ad appears on the Status page for every Vynk user. Every ad is reviewed first.</p>
  <div class="adseg"><button class="on" data-a="adMode" data-v="free"><b>Free</b><small>1 day · once a week</small></button><button data-a="adMode" data-v="paid"><b>Paid</b><small>${esc(price)}</small></button></div>
  <div class="adlab">Preview</div><div id="adpv"></div>
  <div class="adlab">Details</div>
  <div class="field">${ic('edit',19)}<input id="adt" maxlength="60" placeholder="Title" autocomplete="off"></div>
  <div class="field">${ic('info',19)}<input id="adb" maxlength="200" placeholder="Short description" autocomplete="off"></div>
  <div class="field">${ic('link',19)}<input id="adl" maxlength="200" placeholder="Link (https://…) optional" autocomplete="off" autocapitalize="none"></div>
  <button class="adpick" data-a="adImg">${ic('camera',19)}<span id="adis">Add a picture (optional)</span></button>
  <div id="adpay" hidden><div class="adlab">Duration</div><div class="field">${ic('clock',19)}<select id="add">${[1,3,7,14,30].map(n=>`<option value="${n}">${n} day${n>1?'s':''}</option>`).join('')}</select></div>
   <div class="adlab">Payment</div><div class="adpb"><div><small>Send ${esc(price)} to</small><b>${esc(info||'Details coming soon')}</b></div>${AD.num?`<button class="adcp" data-a="adCopy" aria-label="Copy number">${ic('copy',18)}</button>`:''}</div>
   <div class="field">${ic('db',19)}<select id="adm"><option>Easypaisa</option><option>JazzCash</option><option>Bank transfer</option></select></div>
   <div class="field">${ic('verified',19)}<input id="adx" maxlength="60" placeholder="Transaction ID" autocomplete="off"></div></div>
  <div class="adtot"><span>Total</span><b id="adtot">Free</b></div>
  <button class="btn" data-a="adSend">Submit for review</button>
  <button class="btn" style="margin:12px 0 0" data-a="adMine">My ads</button>
  <div class="note2">Reviewed by the owner, usually within a day. Scams, adult content and false claims are rejected.</div>`);adPrev();adTotal()},
 adCopy:()=>{try{navigator.clipboard.writeText(AD.num).then(()=>toast('Number copied'),()=>toast(AD.num))}catch(e){toast(AD.num)}},
 adMode:(v,el)=>{AD.free=v==='free';document.querySelectorAll('.adseg button').forEach(b=>b.classList.toggle('on',b===el));const p=$('#adpay');if(p)p.hidden=AD.free;adTotal()},
 adImg:()=>pickFile('image/*',f=>readImg(f,360,.6,u=>{AD.img=u.length<80000?u:'';const e=$('#adis');if(e)e.textContent=AD.img?'Picture added':'Picture too big, try another';adPrev()})),
 adSend:async()=>{const t=($('#adt').value||'').trim(),b=($('#adb').value||'').trim();if(t.length<3||b.length<5){toast('Add a title and a short description');return}
  try{await rpc('ad_create',{p_title:t,p_body:b,p_link:($('#adl').value||'').trim(),p_img:AD.img,p_days:AD.free?1:+$('#add').value,p_free:AD.free,p_method:AD.free?null:$('#adm').value,p_txn:AD.free?null:($('#adx').value||'').trim()});closeSheet();toast('Sent. We will review it soon')}catch(e){toast(String(e.message||'Failed').slice(0,80))}},
 adMine:async()=>{closeSheet();const el=adPage('<h2 class="apt">My ads</h2><p class="aps">Loading…</p>');
  try{const a=await rpc('ad_mine');el.querySelector('.sheet').innerHTML=`<button class="apx" type="button" aria-label="Close">${ic('x',18)}</button><h2 class="apt">My ads</h2><p class="aps">Status and results of your promotions.</p>`+(a&&a.length?a.map(x=>`<div class="adm"><div class="adm1"><b>${esc(x.title)}</b><span class="adst ${x.status}">${esc(x.status)}</span></div><div class="adm2">${x.status==='approved'?`<span><b>${x.views}</b>views</span><span><b>${x.clicks}</b>clicks</span><span><b>${Math.max(0,Math.ceil((new Date(x.ends_at)-Date.now())/864e5))}</b>days left</span>`:`<span>${x.is_free?'Free ad':'Paid ad'} · ${x.days} day${x.days>1?'s':''}</span>`}</div></div>`).join(''):'<div class="aph2" style="margin-top:20px">No ads yet.</div>')+`<button class="btn" data-a="adNew">Create an ad</button>`;el.querySelector('.apx').onclick=()=>closeSheet()}catch(e){toast('Failed')}},
 ownerAds:async()=>{closeSheet();const el=adPage('<h2 class="apt">Ads review</h2><p class="aps">Loading…</p>');
  try{if(S.okey){const c=await sb('/rest/v1/rpc/owner_claim',{m:'POST',b:{k:S.okey}});await c.text()}const a=await rpc('owner_ads_list');
   el.querySelector('.sheet').innerHTML=`<button class="apx" type="button" aria-label="Close">${ic('x',18)}</button><h2 class="apt">Ads review</h2><p class="aps">Pending ads first. Check the payment before approving.</p>`+(a&&a.length?a.map(x=>`<div class="adm"><div class="adm1"><b>${esc(x.title)}</b><span class="adst ${x.status}">${esc(x.status)}</span></div><div class="adrv">@${esc(x.username)}<br>${esc(x.body)}${x.link?'<br>'+esc(x.link):''}</div><div class="adm2"><span>${x.is_free?'Free':'Paid · '+esc(x.method||'')+' · '+esc(x.txn||'')}</span><span>${x.days}d</span><span>${x.views} views</span><span>${x.clicks} clicks</span>${x.reports?`<span style="color:#ff6b6b">${x.reports} reports</span>`:''}</div>${x.status==='pending'||x.status==='removed'?`<div class="adact"><button class="ok" data-a="adOk" data-v="${x.id}|1">Approve</button><button data-a="adOk" data-v="${x.id}|0">Reject</button></div>`:x.status==='approved'?`<div class="adact"><button data-a="adOk" data-v="${x.id}|0">Remove</button></div>`:''}</div>`).join(''):'<div class="aph2" style="margin-top:20px">No ads yet.</div>');el.querySelector('.apx').onclick=()=>closeSheet()}
  catch(e){toast('Could not load. Unlock owner mode again, then retry.')}},
 adOk:async v=>{const[id,ok]=v.split('|');try{await rpc('owner_ad_decide',{p_id:+id,p_approve:ok==='1'});toast(ok==='1'?'Ad approved':'Ad rejected');ACT.ownerAds()}catch(e){toast('Failed')}}
});
let AD={};
</script>
