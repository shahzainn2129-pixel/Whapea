/* ---------- sending and simulated delivery ---------- */
function appendMsg(c,m){const el=$('#msgs');
  if(!el||!S.chat||S.chat!==c.id||c.find){drawMsgs(true);if(!S.chat)render();return}
  el.querySelector('.typing')?.remove();
  el.insertAdjacentHTML('beforeend',msgHTML(c,m,c.msgs.length-1)+(c.typing?'<div class="typing"><i></i><i></i><i></i></div>':''));el.scrollTop=el.scrollHeight}
function pushMsg(c,m){
  m.status=chatReach(c)==='none'?'queued':'sent';c.msgs.push(m);c.pinned&&0;
  appendMsg(c,m);
  if(m.status!=='queued')deliver(c,m);
}
function deliver(c,m){
  const slow=chatReach(c)==='relay'?1300:0;
  sleep(()=>{m.status='delivered';m.tD=Date.now();refresh()},650+slow);
  sleep(()=>{if(SET.receipts){m.status='read';m.tR=Date.now();refresh()}
    if(m.type==='text'||m.type==='voice'||m.type==='img')replyLater(c)},1700+slow);
}
function replyLater(c){
  if(Math.random()<.25)return;const who=c.type==='group'?c.members.filter(x=>reach(x)!=='none')[0]:c.cid;if(!who)return;
  sleep(()=>{c.typing=P[who].name.split(' ')[0];refresh()},500);
  sleep(()=>{c.typing=null;c.msgs.push(M(who,REPLIES[Math.floor(Math.random()*REPLIES.length)],0,{t:Date.now(),status:'read'}));
    if(S.chat!==c.id){c.unread++;if(SET.notif)toast(P[who].name.split(' ')[0]+': '+prev(last(c)))}refresh()},2300);
}
let _rfq=0;function refresh(){if(_rfq)return;_rfq=requestAnimationFrame(()=>{_rfq=0;if(S.chat){drawHead();drawMsgs(false)}else render()})}
function flushQueue(cid){chats.forEach(c=>{if(chatReach(c)!=='none')c.msgs.forEach(m=>{if(m.from==='me'&&m.status==='queued'){m.status='sent';deliver(c,m)}})});refresh()}

function pickFile(accept,cb){const f=document.createElement('input');f.type='file';f.accept=accept;f.style.display='none';document.body.append(f);f.onchange=()=>{if(f.files[0])cb(f.files[0]);f.remove()};f.click()}
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

(()=>{let t=null;const W=210;
 const closeAll=ex=>document.querySelectorAll('.srw>.li').forEach(l=>{if(l!==ex&&l.style.transform){l.style.transform='';l._open=false}});
 document.addEventListener('touchstart',e=>{const x=e.touches[0],li=e.target.closest('.srw>.li'),mb=e.target.closest('.mrow .b');
  if(!li)closeAll();
  t=li?{k:'c',el:li,x:x.clientX,y:x.clientY,base:li._open?-W:0}:mb?{k:'m',el:mb.closest('.mrow'),b:mb,x:x.clientX,y:x.clientY,base:0}:null;if(t)t.on=false},{passive:true});
 document.addEventListener('touchmove',e=>{if(!t)return;const x=e.touches[0],dx=x.clientX-t.x,dy=x.clientY-t.y;

  if(T.k==='c'){const open=(T.base+dx)<-W/2;T.el.style.transform=open?'translateX('+(-W)+'px)':'';T.el._open=open;T.el._lp=true;setTimeout(()=>{T.el._lp=false},350)}

})();

  chats.forEach(c=>{if(c.type!=='dm'||!isNet(c.cid))return;let n=0;
    c.msgs.forEach(m=>{if(m.from==='me'&&!m.deleted&&m.status==='sent'&&m.t>lim&&Date.now()-m.t>60000&&n<20){n++;sendMsg(c,m)}})})}
setTimeout(resendStuck,12000);
setInterval(()=>{if(NET.s&&navigator.onLine)netFlush()},15000);

/* say why a message is not leaving */
const _dc2=drawComp;
drawComp=function(){_dc2.apply(this,arguments);try{const c=chatOf(S.chat);if(!c||c.req||c.type!=='dm')return;const e=NET.err;
  if(!e||Date.now()-e.t>180000)return;if(!c.msgs.some(m=>m.from==='me'&&m.status==='queued'))return;const comp=$('#comp');if(!comp||comp.querySelector('.sendwarn'))return;
  comp.insertAdjacentHTML('afterbegin','<div class="sendwarn" data-a="retryAll">Not sent: '+esc(e.r)+'. Tap to try again</div>')}catch(x){}};
ACT.retryAll=()=>{NET.err=null;netFlush();toast('Trying again');drawComp()};
const st=document.createElement('style');st.textContent='.sendwarn{width:100%;font-size:12px;padding:6px 12px;text-align:center;background:var(--surface2);color:var(--ink);border-radius:10px;margin-bottom:6px}';document.head.append(st);
})();

 adDelAsk:v=>{const el=sheet('Delete this ad?',`<p style="color:var(--muted);margin:0 0 14px">It will stop showing and its results will be removed.</p><button class="btn" data-a="adDel" data-v="${v}">Delete</button>`)},
 adDel:async v=>{try{await rpc('ad_delete',{p_id:+v});closeSheet();toast('Ad deleted');ACT.adMine()}catch(e){toast('Failed')}},
 adDup:async v=>{const x=(AD.mine||[]).find(y=>String(y.id)===String(v));if(!x)return;await ACT.adNew();AD.imgs=x.imgs||[];AD.img=x.img||'';AD.cta=x.cta||'learn';AD.places=(x.places||['status']).slice();const set=(i,val)=>{const e=$(i);if(e)e.value=val||''};set('#adt',x.title);set('#adb',x.body);set('#adl',x.link);set('#adc',AD.cta);set('#adph',x.phone);set('#adci',x.t_city);set('#adg',x.t_gender||'all');const w=$('#adphw');if(w)w.hidden=AD.cta!=='call';document.querySelectorAll('#adpl button').forEach(b=>b.classList.toggle('on',AD.places.includes(b.dataset.v)));adPrev()},
 ownerAds:async()=>{closeSheet();const el=adPage('<h2 class="apt">Ads review</h2><p class="aps">Loading…</p>');
  try{if(S.okey){const c=await sb('/rest/v1/rpc/owner_claim',{m:'POST',b:{k:S.okey}});await c.text()}const a=await rpc('owner_ads_list');
   el.querySelector('.sheet').innerHTML=`<button class="apx" type="button" aria-label="Close">${ic('x',18)}</button><h2 class="apt">Ads review</h2><p class="aps">Pending ads first. Check the payment before approving.</p>`+(a&&a.length?a.map(x=>`<div class="adm"><div class="adm1"><b>${esc(x.title)}</b><span class="adst ${x.status}">${esc(x.status)}</span></div><div class="adrv">@${esc(x.username)}<br>${esc(x.body)}${x.link?'<br>'+esc(x.link):''}</div><div class="adm2"><span>${x.is_free?'Free':'Paid · '+esc(x.method||'')+' · '+esc(x.txn||'')}</span><span>${x.days}d</span><span>${x.views} views</span><span>${x.clicks} clicks</span>${x.reports?`<span style="color:#ff6b6b">${x.reports} reports</span>`:''}</div>${x.status==='pending'||x.status==='removed'?`<div class="adact"><button class="ok" data-a="adOk" data-v="${x.id}|1">Approve</button><button data-a="adOk" data-v="${x.id}|0">Reject</button></div>`:x.status==='approved'?`<div class="adact"><button data-a="adOk" data-v="${x.id}|0">Remove</button></div>`:''}</div>`).join(''):'<div class="aph2" style="margin-top:20px">No ads yet.</div>');el.querySelector('.apx').onclick=()=>closeSheet()}
  catch(e){toast('Could not load. Unlock owner mode again, then retry.')}},
 adOk:async v=>{const[id,ok]=v.split('|');try{await rpc('owner_ad_decide',{p_id:+id,p_approve:ok==='1'});toast(ok==='1'?'Ad approved':'Ad rejected');ACT.ownerAds()}catch(e){toast('Failed')}}
});
let AD={};

/* ===== profile options ===== */
const DU=(()=>{try{return JSON.parse(localStorage.getItem('vdu')||'{}')}catch(e){return{}}})();
function fmtB(n){return n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?Math.round(n/1024)+' KB':n+' B'}
(()=>{const f=window.fetch;window.fetch=async function(u,o){const r=await f.apply(this,arguments);try{if(typeof u==='string'&&u.startsWith(SB)){DU.tx=(DU.tx||0)+(o&&typeof o.body==='string'?o.body.length:0)+200;DU.rx=(DU.rx||0)+(+r.headers.get('content-length')||0)+200;if(!DU.w||Date.now()-DU.w>15000){DU.w=Date.now();localStorage.setItem('vdu',JSON.stringify(DU))}}}catch(e){}return r}})();
Object.assign(ACT,{
 chPw:()=>adPage(`<div class="aph"><span class="aplg">${WLOGO}</span><b>VYNK</b></div><h2 class="apt">Change password</h2><p class="aps">Choose a new password for @${esc(NET.s.user)}. At least 6 characters.</p>
  <div class="field">${ic('lock',19)}<input id="pw1" type="password" placeholder="New password" autocomplete="new-password"></div>
  <div class="field">${ic('lock',19)}<input id="pw2" type="password" placeholder="Repeat new password" autocomplete="new-password"></div>
  <div class="er" id="pwe" style="color:#ff6b6b;font-size:12.5px;min-height:18px;margin-top:8px"></div><button class="btn" data-a="chPwGo">Save password</button>`),
 chPwGo:async()=>{const a=$('#pw1').value,b=$('#pw2').value,e=$('#pwe');if(a.length<6){e.textContent='At least 6 characters';return}if(a!==b){e.textContent='Passwords do not match';return}
  try{const r=await sb('/auth/v1/user',{m:'PUT',b:{password:a}});if(!r.ok){e.textContent='Could not change. Log in again and retry';return}closeSheet();toast('Password changed')}catch(x){e.textContent='No internet'}},
 clrAsk:()=>sheet('Clear all chats?',`<div class="note2" style="font-size:14px;text-align:left">This deletes every message on this phone. Your contacts and internet account stay. Others keep their copy.</div><button class="btn" data-a="clrGo">Clear all chats</button><button class="btn" style="margin:10px 0 0" data-a="closeSheet">Cancel</button>`),
 clrGo:()=>{chats.forEach(c=>{c.msgs=[];c.unread=0});persistSoon();closeSheet();render();toast('All chats cleared')},
 dataUse:()=>sheet('Data usage',`<div class="note2" style="font-size:14px;text-align:left">Sent: <b>${fmtB(DU.tx||0)}</b><br>Received: <b>${fmtB(DU.rx||0)}</b><br><br>Counts internet messages, photos and calls signalling made by the app. It is an estimate.</div><button class="btn" data-a="duReset">Reset</button>`),
 duReset:()=>{DU.tx=0;DU.rx=0;try{localStorage.setItem('vdu',JSON.stringify(DU))}catch(e){}closeSheet();render()},
 helpCenter:()=>sheet('Help center',`<div class="note2" style="font-size:13.5px;line-height:1.7;text-align:left">${[['Messages show one tick','The message left your phone but the other phone has not received it yet. It turns into two ticks when it arrives.'],['I am not getting alerts when Vynk is closed','Open Get alerts when app is closed in Privacy and set battery to Unrestricted.'],['I forgot my app lock code','On the lock screen tap Forgot code and use your account password or your security question.'],['How do I find friends','Search their username. No phone number is needed.'],['How do I promote my business','Open Vynk Ads on this page and tap Promote.']].map(x=>`<b>${x[0]}</b><br>${x[1]}<br><br>`).join('')}</div><button class="btn" data-a="reportProb">Contact us</button>`),
 terms:()=>sheet('Terms of service',`<div class="note2" style="font-size:13.5px;line-height:1.7;text-align:left">Use Vynk lawfully and respectfully. Do not send spam, scams, adult content or threats. Ads are reviewed and can be removed at any time without refund when they break these rules. We can block accounts that harm others. Vynk is provided as is.<br><br>See Privacy policy for how your data is handled.</div>`)
});
</script>
