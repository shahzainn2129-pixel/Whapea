/* Layout: one phone-shaped app (tabs, chat screen, sheets) centred on the page; full width on phones. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#efefef; --ink:#0f0f10; --muted:#737373; --line:#dbdbdb;
  --accent:#0095f6; --accent-ink:#ffffff; --accent-soft:#e6f3fe; --out:#1E4FE0; --in:#efefef; --chatbg:#ffffff; --dot:#e3e3e3;
  --good:#12a15a; --warn:#d99a00; --bad:#e0383e; --read:#1a8cff;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#000000; --surface2:#262626; --ink:#f5f5f5; --muted:#a8a8a8; --line:#262626;
  --accent:#4aa8ff; --accent-ink:#00111f; --accent-soft:#0d2a44; --out:#1E4FE0; --in:#262626; --chatbg:#000000; --dot:#1c1c1c;
  --good:#3cc482; --warn:#f0b429; --bad:#ff6b70; --read:#52b0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#000000; --surface2:#262626; --ink:#f5f5f5; --muted:#a8a8a8; --line:#262626;
  --accent:#4aa8ff; --accent-ink:#00111f; --accent-soft:#0d2a44; --out:#1E4FE0; --in:#262626; --chatbg:#000000; --dot:#1c1c1c;
  --good:#3cc482; --warn:#f0b429; --bad:#ff6b70; --read:#52b0ff; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-block:12px}
.phone{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--surface);border-radius:26px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 24px 60px -24px rgba(8,20,45,.35);display:flex;flex-direction:column;min-width:0}
.ic{flex:none;display:block}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:14px 14px 8px 18px}
.brand{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--surface2)}
.ib.pri{background:var(--accent);color:var(--accent-ink)}
.ib.pri:hover{background:var(--accent)}
.body{flex:1;overflow-y:auto;min-height:0;position:relative}
.searchbar{margin:0 16px 8px;display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.searchbar input{flex:1;background:none;border:0;color:var(--ink);font:inherit;min-width:0;outline:0}
.chips{display:flex;gap:8px;padding:4px 16px 10px;overflow-x:auto}
.chip{padding:7px 14px;border-radius:99px;background:var(--surface2);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent)}
/* list rows */
.li{display:flex;gap:12px;align-items:center;padding:10px 18px;width:100%;text-align:left;min-width:0}
.li:hover{background:var(--surface2)}
.li .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .nm{font-weight:600;font-size:15.5px;display:flex;gap:6px;align-items:center;min-width:0}
.li .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{color:var(--muted);display:flex;align-items:center;gap:4px;min-width:0;font-size:13.5px}
.li .sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;color:var(--muted);font-size:12px}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.badge.mute{background:var(--muted)}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:19px;color:#fff;
  background:hsl(var(--h) 52% 44%);position:relative}
.av.sm{width:36px;height:36px;font-size:15px}.av.lg{width:96px;height:96px;font-size:38px}
.av .dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--good);border:2.5px solid var(--surface)}
.av .dot.relay{background:var(--warn)}.av .dot.off{background:var(--muted)}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 18px 6px;font-weight:600}
.tk{width:16px;height:16px;color:var(--muted)}.tk.read{color:var(--read)}
.fab{position:absolute;right:18px;bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px var(--accent);z-index:3}
.empty{padding:48px 28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:18px}
/* bottom nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 8px;flex:none}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:500;position:relative;border-radius:12px}
.nav button.on{color:var(--accent)}
.nav button.on .pill{background:var(--accent-soft)}
.pill{width:44px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.nav .badge{position:absolute;top:-4px;right:-2px;height:17px;min-width:17px;font-size:11px}
/* chat screen */
.screen{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;z-index:20;animation:slide .22s ease-out;min-width:0}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.ch{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 4px;border-bottom:1px solid var(--line);background:var(--surface)}
.ch .who{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding-left:6px}
.ch .who b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .who small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .who small.live{color:var(--good)}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 8px;display:flex;flex-direction:column;gap:3px;background-color:var(--chatbg);min-height:0}
[data-wp="dots"] .msgs{background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}

/* ---------- chat screen ---------- */
function openChat(id){
  const c=chatOf(id);S.chat=id;S.reply=S.edit=S.rec=null;S.emo=false;c.unread=0;c.mk=false;
  if(c.type==='dm'&&reach(c.cid)==='none'&&0){}
  const v=document.createElement('div');v.className='screen';v.id='chatv';
  v.innerHTML=`<div class="ch" id="chh"></div><div class="msgs" id="msgs"></div><div id="aux"></div><div class="comp" id="comp"></div>`;
  phone.append(v);applyWp($('#msgs'),c);drawHead();drawMsgs(true);drawComp();render();
  if(NATIVE&&c.type==='dm')peerSeen(c.cid);
  if(NATIVE)sendReads(c);else if(SET.receipts)c.msgs.forEach(m=>{if(m.from!=='me'&&m.status!=='read')m.status='read'});
}
function closeChat(){S.chat=null;S.rec&&clearInterval(S.rec.iv);S.rec=null;$('#chatv')?.remove();render()}
function drawHead(){
  const c=chatOf(S.chat);if(!c)return;const r=chatReach(c);
  let sub;if(c.typing)sub=`<small class="live">${c.type==='dm'?'':esc(c.typing)+' '}typing…</small>`;
  else if(NATIVE&&c.type==='dm'&&isNet(c.cid)){const q=P[c.cid],sc=q.ls==null||!SET.online?null:q.ls+(Date.now()-(q.lsAt||Date.now()))/1000;sub=sc==null?'<small></small>':sc<100?'<small class="live">online</small>':`<small>last seen ${seenTxt(sc)}</small>`}
  else if(c.type==='group')sub=`<small>${c.members.map(m=>P[m].name.split(' ')[0]).join(', ')}, You</small>`;
  else sub=`<small class="${r==='direct'?'live':''}">${r==='direct'?`In range${P[c.cid].dist!=null?' · '+P[c.cid].dist+' m':''}`:r==='relay'?`Reachable via ${esc(P[P[c.cid].via].name.split(' ')[0])} · 2 hops`:'Out of range · messages will wait'}</small>`;
  $('#chh').innerHTML=`<button class="ib" data-a="closeChat" aria-label="Back">${ic('back')}</button>${av(cHue(c),cName(c),'sm')}<button class="who" data-a="chatInfo"><b>${esc(cName(c))}${c.type==='dm'&&P[c.cid]?bdg(P[c.cid].plan):''}</b>${sub}</button>${c.type==='dm'?`${NATIVE&&isNet(c.cid)?`<button class="ib" data-a="startVideo" data-v="${c.cid}" aria-label="Video call">${ic('video',21)}</button>`:''}<button class="ib" data-a="startCall" data-v="${c.cid}" aria-label="Voice call">${ic('phone',21)}</button>`:(c.type==='group'&&NATIVE&&NET.s&&c.members.some(isNet)?`<button class="ib" data-a="gcStart" data-v="${esc(c.id)}|1" aria-label="Group video call">${ic('video',21)}</button><button class="ib" data-a="gcStart" data-v="${esc(c.id)}|0" aria-label="Group voice call">${ic('phone',21)}</button>`:'')}<button class="ib" data-a="chatMenu" aria-label="More">${ic('more')}</button>`;
}
const hl=t=>esc(t).replace(/@(\w+)/g,'<span class="mention">@$1</span>');
function msgHTML(c,m,i){
  const own=m.from==='me',g=c.type==='group';
  let body='';
  if(m.deleted)body=`<div class="gone">${ic('ban',15)} ${own?'You deleted this message':'This message was deleted'}</div>`;
  else{
    if(m.type==='text'){const sp=/^\u27e6post:(\d+)\u27e7([\s\S]*)$/.exec(m.text||'');body=sp?`<button class="pshare" data-a="openShared" data-v="${sp[1]}"><span class="fi">${ic('image',20)}</span><span style="min-width:0"><b>View post</b><small>${esc(sp[2].slice(0,80))}</small></span></button>`:hl(m.text)}
    if(m.type==='voice'){const on=S.playing===m.id;body=`<div class="voice"><button class="pp" data-a="play" data-v="${m.id}" aria-label="Play">${ic(on?'pause':'play',18)}</button><div class="wave">${[...Array(26)].map((_,k)=>`<i class="${on&&k<S.pp?'on':''}" style="height:${6+((k*7+m.dur*3)%19)}px"></i>`).join('')}</div><small>${dur(on?Math.round(m.dur*S.pp/26):m.dur)}</small>${on?`<button class="spd" data-a="rate" data-v="">${S.rate||1}x</button>`:''}</div>`}
    if(m.type==='img')body=`<img class="img" data-a="openMedia" data-v="${m.id}" src="${m.src}" alt="Photo">${m.text?hl(m.text):''}`;
    if(m.type==='video')body=`<div class="vid" data-a="openMedia" data-v="${m.id}"><video src="${m.src}#t=0.2" preload="metadata" muted playsinline></video><span class="vp">${ic('play',30)}</span>${m.dur?`<small>${dur(m.dur)}</small>`:''}</div>${m.text?hl(m.text):''}`;
    if(m.type==='file'||m.type==='audio')body=`<div class="filec"><span class="fi">${ic(m.type==='audio'?'music':'file',20)}</span><span style="min-width:0"><b style="font-weight:600">${esc(m.name)}</b><small>${esc(m.size)}</small></span></div>`;
    if(m.type==='contact')body=`<div class="filec"><span class="fi">${ic('user',20)}</span><span><b style="font-weight:600">${esc(m.name)}</b><small>Shared contact</small></span></div>`;
    if(m.type==='loc')body=`<div class="loc">${ic('loc',34)}</div>${esc(m.text)}`;
    if(m.type==='poll'){const tot=m.opts.reduce((a,o)=>a+o.v.length,0);body=`<div class="poll"><b>${ic('poll',16)} ${esc(m.q)}</b>${m.opts.map((o,k)=>`<button class="opt ${o.v.includes('me')?'me':''}" data-a="vote" data-v="${m.id}:${k}"><i style="width:${tot?o.v.length/tot*100:0}%"></i><span><span>${esc(o.t)}</span><span>${o.v.length}</span></span></button>`).join('')}</div>`}
  }
  const q=m.reply?`<div class="quote"><b>${esc(m.reply.who)}</b>${esc(m.reply.text)}</div>`:'';
  const rx=Object.entries(m.rx||{}).map(([e,n])=>`<span>${e}${n>1?' '+n:''}</span>`).join('');
  return `<div class="mrow ${own?'out':'in'}${Date.now()-m.t<800?' pop':''}" style="--h:${own?0:P[m.from].hue}"><div class="b" role="button" tabindex="0" data-a="msg" data-v="${m.id}">${g&&!own?`<div class="who">${esc(P[m.from].name)}</div>`:''}${m.fwd?`<div class="fwd">${ic('fwd',13)} Forwarded</div>`:''}${q}${body}<span class="meta">${m.star?ic('star',12):''}${m.edited&&!m.deleted?'edited':''}${c.disap?ic('timer',12):''}${fmt(m.t)}${own?tick(m):''}</span></div>${rx?`<div class="rx">${rx}</div>`:''}</div>`}
const pinTxt=m=>m.type==='text'?m.text:({voice:'Voice message',img:'Photo',video:'Video',file:'File',loc:'Location',poll:'Poll'})[m.type]||'Message';
function dayLbl(a,m){const d=new Date(m.t),k=x=>new Date(x).toDateString();if(a&&k(a.t)===k(m.t))return '';const t=new Date(),y=new Date(Date.now()-864e5);const l=k(m.t)===k(t)?'Aaj':k(m.t)===k(y)?'Kal':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:d.getFullYear()===t.getFullYear()?undefined:'numeric'});return `<div class="dlbl"><span>${l}</span></div>`}
function drawMsgs(scroll){
  const c=chatOf(S.chat);if(!c)return;const el=$('#msgs');if(!el)return;
  const q=c.find?c.find.toLowerCase():'';
  let list=c.msgs.filter(m=>!q||(m.text||'').toLowerCase().includes(q));const lim=c._lim||120,more=list.length>lim;if(more)list=list.slice(-lim);
  const nearBottom=el.scrollHeight-el.scrollTop-el.clientHeight<120;
  el.innerHTML=`<div class="note">${ic('lock',14)}<span>${NATIVE&&c.type==='dm'&&isNet(c.cid)?'Say hello 👋':'Messages travel straight from phone to phone over Bluetooth.'}${c.disap?` Disappearing messages: ${({24:'24 hours',168:'7 days',2160:'90 days'})[c.disap]}.`:''}</span></div>`+
   (c.pin&&c.msgs.find(x=>x.id===c.pin&&!x.deleted)?`<div class="pinb" data-a="goPin">${ic('star',15)}<span>${esc(pinTxt(c.msgs.find(x=>x.id===c.pin)))}</span></div>`:'')+(more?`<button class="earlier" data-a="earlier">Load earlier messages</button>`:'')+list.map((m,i)=>dayLbl(list[i-1],m)+msgHTML(c,m,i)).join('')+(c.typing?`<div class="typing"><i></i><i></i><i></i></div>`:'');
  if(scroll||nearBottom)el.scrollTop=el.scrollHeight;
}
function drawComp(){
  const c=chatOf(S.chat);if(!c)return;const comp=$('#comp'),aux=$('#aux');
  aux.innerHTML=(S.reply?`<div class="banner">${ic('reply',18)}<div><b>Replying to ${esc(S.reply.who)}</b>${esc(S.reply.text)}</div><button class="ib" data-a="cancelAux" aria-label="Cancel">${ic('x',18)}</button></div>`:'')+(S.edit?`<div class="banner">${ic('edit',18)}<div><b>Editing message</b>${esc(S.edit.text)}</div><button class="ib" data-a="cancelAux" aria-label="Cancel">${ic('x',18)}</button></div>`:'')+(S.emo?`<div class="emo">${EMO.map(e=>`<button data-a="emoji" data-v="${e}">${e}</button>`).join('')}</div>`:'');
  if(c.blocked){comp.innerHTML=`<div class="rec" style="color:var(--muted);justify-content:center;font-weight:500">You blocked this contact. <button style="color:var(--accent);font-weight:600" data-a="unblock">Unblock</button></div>`;return}
  if(S.rec){comp.innerHTML=`<button class="ib" data-a="recCancel" aria-label="Cancel" style="color:var(--bad)">${ic('trash')}</button><div class="rec"><span>●</span><span id="rt">0:00</span><div class="wave">${[...Array(24)].map((_,k)=>`<i style="height:${8+(k*5)%18}px;animation-delay:${k*.05}s"></i>`).join('')}</div></div><button class="ib pri" data-a="recSend" aria-label="Send voice message">${ic('send',20)}</button>`;return}
  const keep=$('#msgIn')?.value||(S.edit?S.edit.text:'');
  comp.innerHTML=`<button class="ib" data-a="attach" aria-label="Attach">${ic('clip')}</button><div class="inp"><button class="ib" data-a="emoTog" aria-label="Emoji" style="width:36px;height:40px">${ic('smile',22)}</button><textarea id="msgIn" rows="1" placeholder="Message" aria-label="Message"></textarea></div><button class="ib pri" id="sendBtn" data-a="send" aria-label="Send">${ic('send',20)}</button><button class="ib pri" id="micBtn" data-a="recStart" aria-label="Record voice message">${ic('mic',20)}</button>`;
  const ta=$('#msgIn');ta.value=keep;syncSend();
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';syncSend();if(ta.value.trim())typSend()});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&SET.enter){e.preventDefault();ACT.send()}});
}
function syncSend(){const v=($('#msgIn')?.value||'').trim();const s=$('#sendBtn'),m=$('#micBtn');if(s&&m){s.hidden=!v;m.hidden=!!v}}

/* ---------- sending and simulated delivery ---------- */
function appendMsg(c,m){const el=$('#msgs');
  if(!el||!S.chat||S.chat!==c.id||c.find){drawMsgs(true);if(!S.chat)render();return}
  el.querySelector('.typing')?.remove();
  el.insertAdjacentHTML('beforeend',msgHTML(c,m,c.msgs.length-1)+(c.typing?'<div class="typing"><i></i><i></i><i></i></div>':''));el.scrollTop=el.scrollHeight}
function pushMsg(c,m){
  m.status=chatReach(c)==='none'?'queued':'sent';c.msgs.push(m);c.pinned&&0;
  appendMsg(c,m);
  if(m.status!=='queued')deliver(c,m);
}
function deliver(c,m){
  const slow=chatReach(c)==='relay'?1300:0;
  sleep(()=>{m.status='delivered';m.tD=Date.now();refresh()},650+slow);
  sleep(()=>{if(SET.receipts){m.status='read';m.tR=Date.now();refresh()}
    if(m.type==='text'||m.type==='voice'||m.type==='img')replyLater(c)},1700+slow);
}
function replyLater(c){
  if(Math.random()<.25)return;const who=c.type==='group'?c.members.filter(x=>reach(x)!=='none')[0]:c.cid;if(!who)return;
  sleep(()=>{c.typing=P[who].name.split(' ')[0];refresh()},500);
  sleep(()=>{c.typing=null;c.msgs.push(M(who,REPLIES[Math.floor(Math.random()*REPLIES.length)],0,{t:Date.now(),status:'read'}));
    if(S.chat!==c.id){c.unread++;if(SET.notif)toast(P[who].name.split(' ')[0]+': '+prev(last(c)))}refresh()},2300);
}
let _rfq=0;function refresh(){if(_rfq)return;_rfq=requestAnimationFrame(()=>{_rfq=0;if(S.chat){drawHead();drawMsgs(false)}else render()})}
function flushQueue(cid){chats.forEach(c=>{if(chatReach(c)!=='none')c.msgs.forEach(m=>{if(m.from==='me'&&m.status==='queued'){m.status='sent';deliver(c,m)}})});refresh()}

/* ---------- actions ---------- */
function msgById(id){const c=chatOf(S.chat);return [c,c.msgs.find(m=>m.id===id)]}
function pickFile(accept,cb){const f=document.createElement('input');f.type='file';f.accept=accept;f.style.display='none';document.body.append(f);f.onchange=()=>{if(f.files[0])cb(f.files[0]);f.remove()};f.click()}
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function ctxMenu(id){
  const c=chatOf(id);sheet(cName(c),
   A('cm_pin',id,'pin',c.pinned?'Unpin chat':'Pin chat')+A('cm_fav',id,'star',c.fav?'Remove from favourites':'Add to favourites')+A('cm_mute',id,'mute',c.muted?'Unmute notifications':'Mute notifications')+
   A('cm_arch',id,'archive','Archive chat')+A('cm_unread',id,'chat',c.unread||c.mk?'Mark as read':'Mark as unread')+A('cm_clear',id,'x','Clear chat')+
   (c.type==='dm'?A('cm_block',id,'ban',c.blocked?'Unblock':'Block','','bad')+(NATIVE&&isNet(c.cid)?A('cm_report',id,'ban','Report user','Spam, abuse or fake account','bad'):''):'')+A('cm_del',id,'trash','Delete chat','','bad'))}

 tab:v=>{S.tab=v;render()},

 openCid:v=>{closeSheet();S.tab='chats';openChat(v)},
 closeChat,
 archived:()=>{const L=chats.filter(c=>c.archived);sheet('Archived chats',L.map(c=>A('unarch',c.id,null,cName(c),prev(last(c)))).join(''))},

 chatsMenu:()=>sheet('',A('newGroup','', 'users','New group')+A('starred','', 'star','Starred messages')+A('archived','', 'archive','Archived chats')+A('linked','', 'globe','Linked devices','Needs the internet, not available')+A('broadcast','', 'send','Broadcast list','Needs a connection to each recipient')),

 newChat:()=>sheet('New chat',(NATIVE?A('netFind','','search','Find by username','Chat over the internet'):'')+A('newGroup','', 'users','New group','Chat with several people nearby')+A('tab','near','radar','Find people nearby')+Object.keys(P).map(k=>`<button class="act" data-a="openCid" data-v="${k}">${av(P[k].hue,P[k].name,'sm',dotOf(k))}<span class="grow">${esc(P[k].name)}<small>${esc(P[k].about)}</small></span></button>`).join('')),
 newGroup:()=>{closeSheet();const s=sheet('New group',`<div class="field"><input id="gname" placeholder="Group name" maxlength="30" autocomplete="off"></div>${Object.keys(P).map(k=>`<label class="act"><input type="checkbox" class="gm" value="${k}" id="gm_${k}">${av(P[k].hue,P[k].name,'sm')}<span class="grow">${esc(P[k].name)}</span></label>`).join('')}<button class="btn" data-a="mkGroup">Create group</button><div class="note2">Groups work best with 20 to 30 people close together.</div>`)},
 mkGroup:()=>{const n=$('#gname').value.trim(),mem=[...document.querySelectorAll('.gm:checked')].map(x=>x.value);if(!n||mem.length<1){toast('Add a name and at least one person');return}
   const c={id:'g'+uid(),type:'group',name:n,hue:Math.floor(Math.random()*360),members:mem,unread:0,msgs:[M('me',`You created the group "${n}"`,0,{t:Date.now(),status:'read'})]};chats.push(c);closeSheet();openChat(c.id)},
 /* row context menu */
 cm_pin:v=>{const c=chatOf(v);if(!c.pinned&&chats.filter(x=>x.pinned).length>=3){toast('You can pin up to 3 chats');return}c.pinned=!c.pinned;closeSheet();render()},
 cm_fav:v=>{const c=chatOf(v);c.fav=!c.fav;closeSheet();render()},
 swMute:v=>{ACT.cm_mute(v)},swArch:v=>{ACT.cm_arch(v)},swDel:v=>{sheet('Delete this chat?',A('cm_del',v,'trash','Delete chat','All messages in it will be removed','bad'))},
 notifHelp:()=>sheet('Alerts when app is closed',`<div class="note2" style="font-size:13.5px;line-height:1.6;text-align:left">Vynk checks for new messages and likes in the background. Some phones stop this to save battery.<br><br>1. Open phone <b>Settings → Apps → Vynk → Battery</b><br>2. Choose <b>Unrestricted</b><br>3. Allow <b>Notifications</b> for Vynk</div>`),

 cm_unread:v=>{const c=chatOf(v);if(c.unread||c.mk){c.unread=0;c.mk=false}else c.mk=true;closeSheet();render()},
 cm_clear:v=>{chatOf(v).msgs=[];closeSheet();refresh();toast('Chat cleared')},
 cm_block:v=>{const c=chatOf(v);c.blocked=!c.blocked;closeSheet();if(S.chat)drawComp();render();toast(c.blocked?'Blocked. You will not get their messages or calls':'Unblocked')},

 cm_del:v=>{const i=chats.findIndex(c=>c.id===v);chats.splice(i,1);closeSheet();if(S.chat)closeChat();render();toast('Chat deleted')},
 /* chat screen */
 chatMenu:()=>{const c=chatOf(S.chat);sheet('',A('findIn','', 'search','Search in chat')+A('disapPickChat','', 'timer','Disappearing messages',({0:'Off',24:'24 hours',168:'7 days',2160:'90 days'})[c.disap||0])+A('cmFolder',c.id,'users','Folder',({family:'Family',work:'Work'})[c.folder]||'None')+A('cm_mute',c.id,'mute',c.muted?'Unmute':'Mute notifications')+A('cm_wp',c.id,'image','Chat wallpaper')+A('media','', 'image','Media, links and documents')+A('lockChat','', 'lock','Lock this chat')+A('cm_clear',c.id,'x','Clear chat')+(c.type==='dm'?A('cm_block',c.id,'ban','Block','','bad'):A('exit','', 'back','Exit group','','bad')))},
 exit:()=>{const c=chatOf(S.chat);closeSheet();c.archived=true;closeChat();toast('You left the group')},
 lockChat:()=>{closeSheet();toast('This chat is now locked with your app lock')},
 findIn:()=>{closeSheet();const c=chatOf(S.chat);$('#aux').innerHTML=`<div class="banner">${ic('search',18)}<input class="txt" id="fin" placeholder="Search in this chat" style="padding:7px 10px" autocomplete="off"><button class="ib" data-a="cancelFind" aria-label="Close">${ic('x',18)}</button></div>`;

 setDisap:v=>{const c=chatOf(S.chat);c.disap=+v;closeSheet();drawMsgs(false);toast(+v?'Messages will disappear':'Disappearing messages off')},
 media:()=>{closeSheet();const c=chatOf(S.chat),L=c.msgs.filter(m=>['img','file','audio'].includes(m.type));sheet('Media, links and documents',L.length?L.map(m=>A('nop','',m.type==='img'?'image':'file',m.name||'Photo',fmt(m.t))).join(''):'<div class="empty"><b>Nothing shared yet</b>Photos, documents and audio appear here.</div>')},
 nop:()=>{},

   else sheet(c.name,`<div class="sec">${c.members.length+1} members</div>`+c.members.map(k=>`<div class="act">${av(P[k].hue,P[k].name,'sm',dotOf(k))}<span class="grow">${esc(P[k].name)}<small>${esc(P[k].about)}</small></span></div>`).join('')+`<div class="act">${avMe('sm')}<span class="grow">You<small>Admin</small></span></div>`)},
 /* messages */
 msg:v=>{const [c,m]=msgById(v);if(!m)return;const own=m.from==='me',editable=own&&m.type==='text'&&!m.deleted&&Date.now()-m.t<15*MIN;
   if(m.deleted){sheet('',A('delMe',v,'trash','Delete for me','','bad'));return}
   sheet('',`<div class="rxrow">${['👍','❤️','😂','😮','😢','🙏'].map(e=>`<button data-a="react" data-v="${v}|${e}">${e}</button>`).join('')}</div>`+
   A('replyTo',v,'reply','Reply')+(m.type==='text'?A('copy',v,'copy','Copy'):'')+A('fwdPick',v,'fwd','Forward')+A('star',v,'star',m.star?'Unstar':'Star')+A('pinMsg',v,'star',c.pin===m.id?'Unpin':'Pin to top')+
   (editable?A('editMsg',v,'edit','Edit','Available for 15 minutes'):'')+(own?A('info',v,'info','Message info'):'')+A('delMe',v,'trash','Delete for me')+(own?A('delAll',v,'trash','Delete for everyone','','bad'):''))},
 cmFolder:v=>{closeSheet();sheet('Folder',A('setFolder',v+'|','x','None')+A('setFolder',v+'|family','users','Family')+A('setFolder',v+'|work','users','Work'))},
 setFolder:v=>{const[id,f]=v.split('|'),c=chatOf(id);if(!c)return;c.folder=f||null;closeSheet();render();persistSoon();toast(f?'Moved to '+f:'Removed from folder')},
 pinMsg:v=>{const[c,m]=msgById(v);if(!m)return;c.pin=c.pin===m.id?null:m.id;closeSheet();drawMsgs(false);persistSoon();toast(c.pin?'Pinned':'Unpinned')},
 goPin:()=>{const c=chatOf(S.chat);if(!c||!c.pin)return;let e=document.querySelector('[data-a="msg"][data-v="'+c.pin+'"]');if(!e){c._lim=9999;drawMsgs(false);e=document.querySelector('[data-a="msg"][data-v="'+c.pin+'"]')}if(e){e.scrollIntoView({block:'center'});const r=e.closest('.mrow');r.classList.add('hlp');setTimeout(()=>r.classList.remove('hlp'),1300)}},
 rate:()=>{S.rate=S.rate===1.5?2:S.rate===2?1:1.5;if(AUD)AUD.playbackRate=S.rate;drawMsgs(false)},
 earlier:()=>{const c=chatOf(S.chat);if(!c)return;const el=$('#msgs'),h=el.scrollHeight;c._lim=(c._lim||120)+150;drawMsgs(false);el.scrollTop=el.scrollHeight-h},
 react:v=>{const [id,e]=v.split('|'),[c,m]=msgById(id);m.rx=m.rx||{};m.rx[e]=(m.rx[e]||0)+1;netSend(c,{t:'rx',id,e});closeSheet();drawMsgs(false)},
 replyTo:v=>{const [c,m]=msgById(v);S.reply={who:who(c,m),text:prev(m)};S.edit=null;closeSheet();drawComp();$('#msgIn')?.focus()},
 copy:async v=>{const [c,m]=msgById(v);closeSheet();try{await copyText(m.text);toast('Copied')}catch(e){toast('Press and hold the text to copy')}},
 star:v=>{const [c,m]=msgById(v);m.star=!m.star;closeSheet();drawMsgs(false);toast(m.star?'Starred':'Unstarred')},
 editMsg:v=>{const [c,m]=msgById(v);S.edit=m;S.reply=null;closeSheet();drawComp();const t=$('#msgIn');t.focus()},
 delMe:v=>{const c=chatOf(S.chat);c.msgs=c.msgs.filter(m=>m.id!==v);closeSheet();drawMsgs(false);render()},
 delAll:v=>{const [c,m]=msgById(v);netSend(c,{t:'del',id:v});Object.assign(m,{deleted:true,text:'',type:'text',rx:{},star:false});closeSheet();drawMsgs(false);render();toast(m.status==='queued'?'Deleted. It will not be delivered':'Deleted for everyone')},
 info:v=>{const [c,m]=msgById(v);closeSheet();sheet('Message info',`<div class="act">${ic('check')}<span class="grow">Sent<small>${fmt(m.t)}</small></span></div><div class="act">${ic('dcheck')}<span class="grow">Delivered<small>${m.status==='queued'?'Waiting for the other phone to come in range':m.status==='sent'?'Pending':fmt(m.tD||m.t)}</small></span></div><div class="act">${ic('eye')}<span class="grow">Read<small>${m.status==='read'?fmt(m.tR||m.t):'Not yet'}</small></span></div>`)},
 fwdPick:v=>{closeSheet();sheet('Forward to',chats.filter(c=>!c.blocked).map(c=>A('fwdTo',v+'|'+c.id,null,cName(c))).join(''))},
 fwdTo:v=>{const [id,cid]=v.split('|'),[c0,m]=msgById(id),c=chatOf(cid);closeSheet();const n={...m,id:newId(),from:'me',t:Date.now(),fwd:true,rx:{},star:false,reply:null};pushMsg(c,n);toast('Forwarded to '+cName(c))},
 vote:v=>{const [id,k]=v.split(':'),[c,m]=msgById(id);const o=m.opts[+k],had=o.v.includes('me');m.opts.forEach(x=>x.v=x.v.filter(y=>y!=='me'));if(!had)o.v.push('me');drawMsgs(false)},
 play:v=>{const [c,m]=msgById(v);if(S.playing===v){clearInterval(S.pi);S.playing=null;drawMsgs(false);return}clearInterval(S.pi);S.playing=v;S.pp=0;
   S.pi=setInterval(()=>{S.pp++;if(S.pp>26){clearInterval(S.pi);S.playing=null}drawMsgs(false)},Math.max(120,m.dur*1000/26));drawMsgs(false)},
 cancelAux:()=>{S.reply=S.edit=null;if($('#msgIn'))$('#msgIn').value='';drawComp()},
 emoTog:()=>{S.emo=!S.emo;const k=$('#msgIn').value;drawComp();$('#msgIn').value=k;syncSend()},
 emoji:v=>{const t=$('#msgIn');t.value+=v;syncSend();t.focus()},
 send:()=>{const t=$('#msgIn'),txt=t.value.trim();if(!txt)return;const c=chatOf(S.chat);
   if(S.edit){S.edit.text=txt;S.edit.edited=true;netSend(c,{t:'edit',id:S.edit.id,text:txt});S.edit=null;drawComp();drawMsgs(false);return}
   const m=M('me',txt,0,{t:Date.now(),reply:S.reply});S.reply=null;S.emo=false;t.value='';t.style.height='auto';drawComp();pushMsg(c,m)},
 recStart:()=>{S.rec={s:0};S.rec.iv=setInterval(()=>{S.rec.s++;const e=$('#rt');if(e)e.textContent=dur(S.rec.s)},1000);drawComp()},
 recCancel:()=>{clearInterval(S.rec.iv);S.rec=null;drawComp()},
 recSend:()=>{const c=chatOf(S.chat),d=Math.max(2,S.rec.s);clearInterval(S.rec.iv);S.rec=null;drawComp();pushMsg(c,M('me','',0,{t:Date.now(),type:'voice',dur:d}));toast('Voice note sent (prototype: audio is simulated)')},
 attach:()=>{const c=chatOf(S.chat);sheet('',`<div class="grid4">${[['attPhoto','image','Photo',215],['attDoc','file','Document',28],['attAudio','music','Audio',330],['attContact','user','Contact',150],['attLoc','loc','Location',182],...(c.type==='group'?[['attPoll','poll','Poll',268]]:[])].map(([a,i,l,h])=>`<button data-a="${a}"><span class="c" style="--h:${h}">${ic(i,24)}</span>${l}</button>`).join('')}</div><div class="note2">Large files switch to Wi-Fi Direct automatically when both phones support it.</div>`)},
 attPhoto:()=>{closeSheet();pickFile('image/*',f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,(SET.quality==='high'?900:SET.quality==='standard'?640:420)/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
     const src=cv.toDataURL('image/jpeg',.6);pushMsg(chatOf(S.chat),M('me','',0,{t:Date.now(),type:'img',src}));toast('Photo compressed to '+size(src.length*.75)+' before sending')};im.src=r.result};r.readAsDataURL(f)})},
 attDoc:()=>{closeSheet();pickFile('*/*',f=>pushMsg(chatOf(S.chat),M('me','',0,{t:Date.now(),type:'file',name:f.name,size:size(f.size)})))},
 attAudio:()=>{closeSheet();pickFile('audio/*',f=>pushMsg(chatOf(S.chat),M('me','',0,{t:Date.now(),type:'audio',name:f.name,size:size(f.size)})))},
 attContact:()=>{closeSheet();sheet('Share a contact',Object.keys(P).map(k=>A('shareC',k,null,P[k].name)).join(''))},
 shareC:v=>{closeSheet();pushMsg(chatOf(S.chat),M('me','',0,{t:Date.now(),type:'contact',name:P[v].name}))},
 attLoc:()=>{closeSheet();pushMsg(chatOf(S.chat),M('me','Location shared (visible while in range)',0,{t:Date.now(),type:'loc'}))},
 attPoll:()=>{closeSheet();sheet('New poll',`<div class="field"><input id="pq" placeholder="Question" autocomplete="off"></div><div class="field"><input id="po1" placeholder="Option 1" autocomplete="off"></div><div class="field"><input id="po2" placeholder="Option 2" autocomplete="off"></div><div class="field"><input id="po3" placeholder="Option 3 (optional)" autocomplete="off"></div><button class="btn" data-a="mkPoll">Send poll</button>`)},
 mkPoll:()=>{const q=$('#pq').value.trim(),o=['po1','po2','po3'].map(i=>$('#'+i).value.trim()).filter(Boolean);if(!q||o.length<2){toast('Add a question and two options');return}closeSheet();pushMsg(chatOf(S.chat),M('me','',0,{t:Date.now(),type:'poll',q,opts:o.map(t=>({t,v:[]}))}))},
 /* calls */
 startCall:v=>{const r=reach(v);if(r!=='direct'){toast(P[v].name.split(' ')[0]+' is out of direct range. Voice calls need a direct Bluetooth link.');return}callScreen(v)},
 callBack:v=>ACT.startCall(v),
 newCall:()=>sheet('Call someone nearby',Object.keys(P).map(k=>`<button class="act" data-a="startCall" data-v="${k}">${av(P[k].hue,P[k].name,'sm',dotOf(k))}<span class="grow">${esc(P[k].name)}<small>${reach(k)==='direct'?'In direct range':'Not in direct range'}</small></span></button>`).join('')),
 endCall:()=>{const k=S.call;clearInterval(S.ci);$('#callv')?.remove();calls.unshift({cid:k,dir:'out',t:Date.now(),missed:false,d:S.cs});S.call=null;render()},
 cmute:(v,el)=>el.classList.toggle('on'),
 /* nearby */
 flipUsman:()=>{P.usman.range=!P.usman.range;P.usman.dist=P.usman.range?33:null;closeSheet();render();if(P.usman.range){toast('Usman is in range. Delivering waiting messages');flushQueue('usman')}else toast('Usman is out of range')},
 toggleMesh:()=>{SET.mesh=!SET.mesh;render();toast(SET.mesh?'Mesh relay on':'Mesh relay off')},
 /* status */
 addStatus:()=>{const cols=['#1f5eff','#0f766e','#c2410c','#6d28d9','#be185d','#334155'];S.stc=cols[0];S.stcf=false;S.stpo=false;sheet('New status',`<div class="field"><textarea id="stt" rows="3" maxlength="140" placeholder="What is on your mind?" style="background:${cols[0]};color:#fff;font-size:20px;font-family:var(--font-display);text-align:center;border-radius:14px;border:0;width:100%;padding:18px" autocomplete="off"></textarea></div><div class="sw">${cols.map((c,i)=>`<button data-a="stCol" data-v="${c}" class="${i?'':'on'}" style="background:${c}" aria-label="Colour"></button>`).join('')}</div><div class="note2" style="margin-top:0">Visible to: My contacts · lasts 24 hours</div><button class="btn" data-a="postSt">Post status</button>`)},
 stCf:()=>{S.stcf=!S.stcf;$('#stcfb').classList.toggle('sel',S.stcf);toast(S.stcf?(Object.keys(SET.cf||{}).length?'Only your close friends will see this':'Add close friends in Settings first'):'Visible to all contacts')},
 stPoll:()=>{S.stpo=!S.stpo;$('#stpob').classList.toggle('sel',S.stpo);$('#stpoll').style.display=S.stpo?'block':'none'},
 cfOpen:()=>{closeSheet();const L=chats.filter(c=>c.type==='dm');sheet('Close friends',(L.length?L.map(c=>`<button class="act" data-a="cfTog" data-v="${esc(c.cid)}"><span class="grow">${esc(cName(c))}</span>${tg(!!(SET.cf&&SET.cf[c.cid]))}</button>`).join(''):'<div class="note2">No chats yet</div>')+'<div class="note2">Only these people see your close friends status. They see a green tag.</div>')},
 cfTog:v=>{SET.cf=SET.cf||{};if(SET.cf[v])delete SET.cf[v];else SET.cf[v]=1;persistSoon();ACT.cfOpen()},
 stVote:v=>{const[k,id,i]=v.split('|'),it=(STAT[k]||[]).find(x=>x.id===id);if(!it||!it.poll||it.my!=null)return;it.my=+i;persistSoon();tx(k,JSON.stringify({t:'stvote',id,i:+i}))},
 stCol:(v,el)=>{S.stc=v;$('#stt').style.background=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
 postSt:()=>{const t=$('#stt').value.trim();if(!t){toast('Write something first');return}myStatus.push({text:t,bg:S.stc,t:Date.now()});closeSheet();render();toast('Status posted')},
 viewSt:v=>{const L=v==='me'?myStatus:STAT[v];if(!L||!L.length)return;let i=0;const el=document.createElement('div');el.className='sv';phone.append(el);
   let t0=0,left=4000,held=false,hT=0,y0=0;
   const dly=ms=>{clearTimeout(el._t);left=ms;t0=Date.now();el._t=setTimeout(next,ms)};
   const draw=()=>{const s=L[i];el.classList.remove('paused');el.style.background=s.kind==='img'||s.kind==='video'?'#000':s.bg;
     const who=v==='me'?'Your story':esc(P[v].name);
     el.innerHTML=`<div class="svtop"><div class="prog">${L.map((_,k)=>`<i class="${k<i?'done':k===i?'cur':''}"><b></b></i>`).join('')}</div><div class="svh"><span class="ring sm">${v==='me'?avMe('sm'):av(P[v].hue,P[v].name,'sm')}</span><span class="svn"><b>${who}${s.cf?'<i class="cftag">Close friends</i>':''}</b><small>${dayLabel(s.t)}</small></span><button class="ib" data-x="1" aria-label="Close">${ic('x',24)}</button></div></div>${stBody(s)}
     ${v==='me'?`<div class="svbot"><button class="svb" data-del="1" aria-label="Delete">${ic('trash',22)}<small>Delete</small></button><span class="svs">${ic('eye',18)} Seen by 0</span></div>`:`<div class="svbot"><div class="svq">${['❤️','🔥','😂','😮','😢','👏'].map(e=>`<button data-rx="${e}">${e}</button>`).join('')}</div><div class="rep"><input placeholder="Reply to ${esc(P[v].name.split(' ')[0])}…" id="sr" aria-label="Reply to status" autocomplete="off"><button class="ib" style="color:#fff" data-rp="1" aria-label="Send">${ic('send',20)}</button></div></div>`}`;
     clearTimeout(el._t);const vv=el.querySelector('video');if(vv){vv.onended=next;const pi=el.querySelector('.prog i.cur');if(pi&&s.dur)pi.style.setProperty('--d',s.dur+'s')}else dly(4000)};
   const close=()=>{clearTimeout(el._t);el.classList.add('out');setTimeout(()=>el.remove(),160);if(v!=='me')seenSt.add(v);render()};
   const next=()=>{if(i<L.length-1){i++;draw()}else close()};
   const sendTo=t=>{const c=chats.find(x=>x.type==='dm'&&x.cid===v);if(c){pushMsg(c,M('me',t,0,{t:Date.now()}));toast('Sent')}else toast('Open a chat with this person first')};
   const pause=()=>{if(held)return;held=true;clearTimeout(el._t);left=Math.max(300,left-(Date.now()-t0));el.classList.add('paused');el.querySelector('video')?.pause()};
   const play=()=>{if(!held)return;held=false;el.classList.remove('paused');const vv=el.querySelector('video');if(vv)vv.play().catch(()=>{});else dly(left)};
   el.addEventListener('pointerdown',e=>{if(e.target.closest('input,button'))return;y0=e.clientY;clearTimeout(hT);hT=setTimeout(pause,200)});
   const up=e=>{clearTimeout(hT);if(held){play();el._skip=true;setTimeout(()=>el._skip=false,60)}if(y0&&e&&e.clientY-y0>110){y0=0;el._skip=true;close();return}y0=0};
   el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
   el.onclick=e=>{if(el._skip)return;if(e.target.closest('[data-x]')){close();return}if(e.target.closest('[data-del]')){stDelMine(i);close();return}
     const pv=e.target.closest('[data-sv]');if(pv){ACT.stVote(pv.dataset.sv);draw();return}const rx=e.target.closest('[data-rx]');if(rx){sendTo(rx.dataset.rx);return}
     if(e.target.closest('[data-rp]')){const t=$('#sr').value.trim();if(t){sendTo('Replied to your status: '+t);$('#sr').value=''}return}
     if(e.target.closest('input,.svq,.svbot,.svpoll'))return;if(e.clientX<el.getBoundingClientRect().left+el.offsetWidth*.3){i=Math.max(0,i-1);draw()}else next()};
   el.addEventListener('focusin',e=>{if(e.target.id==='sr')pause()});el.addEventListener('focusout',e=>{if(e.target.id==='sr')play()});
   draw()},

 /* sponsors */
 ownerLogin:()=>sheet('Owner sign-in',`<div class=\"note2\" style=\"font-size:14px\">Enter the owner key.</div><div class="field"><input id="opin" type="password" maxlength="40" autocapitalize="characters" placeholder="Owner key" autocomplete="off"></div><button class="btn" data-a="ownerOk">Unlock owner mode</button>`),
 ownerOk:()=>{S.okey=$('#opin').value;if(NATIVE?Android.checkKey($('#opin').value):$('#opin').value===OWNER_PIN){S.owner=true;closeSheet();S.tab='spons';render();toast('Owner mode on. Tap + to post')}else toast('Wrong PIN')},

function flushViews(){const ids=[...new Set(VW.q)];VW.q=[];if(ids.length&&NET.s)rpc('view_posts',{p_ids:ids}).catch(()=>{})}
function observeViews(){if(!NET.s||typeof IntersectionObserver==='undefined')return;
  if(!VW.io)VW.io=new IntersectionObserver(es=>{for(const e of es){const id=e.target.dataset.pid;
    if(e.isIntersecting){if(VW.seen.has(id)||VW.tm.has(id))continue;VW.tm.set(id,setTimeout(()=>{VW.tm.delete(id);VW.seen.add(id);const p=postFind(id);
      if(p&&NET.s&&p.author!==NET.s.uid){VW.q.push(+id);p.views=(+p.views||0)+1;const el=document.querySelector('.pc[data-pid="'+id+'"] .pviews');if(el)el.textContent=fmtN(p.views)+(p.views===1?' view':' views')}
      clearTimeout(VW.t);VW.t=setTimeout(flushViews,2500)},1000))}
    else{const t=VW.tm.get(id);if(t){clearTimeout(t);VW.tm.delete(id)}}}},{threshold:.6});
  VW.io.disconnect();document.querySelectorAll('.pc[data-pid],.tkp[data-pid]').forEach(a=>VW.io.observe(a))}

  const name=NET.s.uid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext,x=new XMLHttpRequest();
  x.open('POST',SB+'/storage/v1/object/post-media/'+name);x.setRequestHeader('Authorization','Bearer '+NET.s.at);x.setRequestHeader('apikey',SBK);x.setRequestHeader('Content-Type',f.type||'video/mp4');x.setRequestHeader('x-upsert','false');
  x.upload.onprogress=e=>{if(e.lengthComputable)cb(Math.round(e.loaded/e.total*100))};
  x.onload=async()=>{if(x.status<300)res(name);else if(x.status===401&&!retry&&await netRefresh())uploadVideo(f,cb,true).then(res,rej);else rej(new Error('upload '+x.status))};
  x.onerror=()=>rej(new Error('net'));x.send(f)})}

    verifyReq:()=>{closeSheet();sheet('Request Verified badge',`<div class="field" style="margin:8px 16px"><input id="vfn" maxlength="60" placeholder="Full name" autocomplete="off"></div><div class="field" style="margin:8px 16px"><input id="vfr" maxlength="300" placeholder="Why should you be verified?" autocomplete="off"></div><div class="field" style="margin:8px 16px"><input id="vfl" maxlength="150" placeholder="Link (website or social page, optional)" autocomplete="off" autocapitalize="none"></div><button class="btn" data-a="verifySend">Send request</button><div class="note2">Fake or copied accounts are rejected.</div>`)},
    verifySend:async()=>{const n=($('#vfn').value||'').trim(),r=($('#vfr').value||'').trim();if(n.length<2||r.length<5){toast('Fill your name and reason');return}
      try{await rpc('verify_apply',{p_name:n,p_reason:r,p_link:($('#vfl').value||'').trim()});toast('Request sent');ACT.plus()}catch(e){toast(rpcErr(e))}},
    ownerVer:async()=>{closeSheet();const el=sheet('Verification requests','<div class="note2">Loading…</div>');
      try{if(S.okey){const c=await sb('/rest/v1/rpc/owner_claim',{m:'POST',b:{k:S.okey}});await c.text()}const a=await rpc('owner_verify_list');
        el.querySelector('.sheet').innerHTML='<div class="grab"></div><h3>Verification requests</h3>'+(a&&a.length?a.map(x=>`<div class="li" style="align-items:flex-start"><span class="mid"><span class="nm"><span>@${esc(x.username)} · ${esc(x.full_name)}</span></span><span class="sub">${esc(x.reason)}${x.link?' · '+esc(x.link):''}</span></span>${x.status==='pending'?`<span class="reqb"><button class="tag g" data-a="verOk" data-v="${x.id}|1">Approve</button><button class="tag" data-a="verOk" data-v="${x.id}|0">Reject</button></span>`:`<span class="tag">${esc(x.status)}</span>`}</div>`).join(''):'<div class="note2">No requests</div>')}
      catch(e){el.querySelector('.sheet').innerHTML='<div class="grab"></div><div class="note2">Could not load. Unlock owner mode again, then retry.</div>'}},
    verOk:async v=>{const[id,ok]=v.split('|');try{await rpc('owner_verify_decide',{p_id:+id,p_approve:ok==='1'});toast(ok==='1'?'Verified badge given':'Rejected');ACT.ownerVer()}catch(e){toast('Failed')}},
    tagOpen:async v=>{$('#tgv')?.remove();const el=document.createElement('div');el.className='screen';el.id='tgv';phone.append(el);
      el.innerHTML=`<div class="ch"><button class="ib" data-a="tgClose" aria-label="Back">${ic('back')}</button><b style="flex:1;font-size:16px;text-align:center;margin-right:44px">#${esc(v)}</b></div><div class="body" style="overflow-y:auto;flex:1"><div class="note2">Loading…</div></div>`;
      try{const a=await rpc('tag_posts',{p_tag:v,p_before:null,p_limit:30})||[];a.forEach(p=>{XP.unshift(p)});XP.length=Math.min(XP.length,60);el.querySelector('.body').innerHTML=a.length?`<div class="grid3">${a.map(gtile).join('')}</div>`:'<div class="empty"><b>No posts yet</b>Nobody has used #'+esc(v)+' yet.</div>'}catch(e){el.querySelector('.body').innerHTML='<div class="note2">Could not load</div>'}},
    tgClose:()=>{$('#tgv')?.remove()},
    mentionOpen:async v=>{try{const a=await(await sb('/rest/v1/profiles?select=id&username=eq.'+encodeURIComponent(v.toLowerCase()))).json();if(a&&a[0])openProf(a[0].id);else toast('User not found')}catch(e){toast('No connection')}},
    reqList:async()=>{closeSheet();const el=sheet('Follow requests','<div class="note2">Loading…</div>');
      try{const a=await rpc('follow_requests_list')||[];el.querySelector('.sheet').innerHTML='<div class="grab"></div><h3>Follow requests</h3>'+(a.length?a.map(x=>`<div class="li">${avatarOf({username:x.username,name:x.name,avatar:x.avatar})}<span class="mid"><span class="nm"><span>${esc(x.username)}${bdg(x.plan)}</span></span><span class="sub">${esc(x.name||'')}</span></span><span class="reqb"><button class="tag g" data-a="reqAns" data-v="${x.id}|1">Accept</button><button class="tag" data-a="reqAns" data-v="${x.id}|0">Decline</button></span></div>`).join(''):'<div class="note2">No requests</div>')}
      catch(e){el.querySelector('.sheet').innerHTML='<div class="grab"></div><div class="note2">Could not load</div>'}},
    reqAns:async v=>{const[id,ok]=v.split('|');try{await rpc('follow_respond',{p_user:id,p_accept:ok==='1'});toast(ok==='1'?'Accepted':'Declined');ACT.reqList()}catch(e){toast(rpcErr(e))}},
    epPriv:()=>{epRead();ED.priv=!ED.priv;epDraw()},
    plusSend:async()=>{const t=($('#pmt').value||'').trim();if(!t){toast('Enter the transaction ID');return}
      try{await rpc('request_plus',{p_method:$('#pmm').value,p_txn:t,p_note:($('#pmn').value||'').trim()});toast('Request sent. We will confirm soon');ACT.plus()}catch(e){toast(/limit/.test(e.message)?'You already have pending requests':rpcErr(e))}},
    ownerPay:async()=>{closeSheet();const el=sheet('Plus payments','<div class="note2">Loading…</div>');
      try{if(S.okey){const c=await sb('/rest/v1/rpc/owner_claim',{m:'POST',b:{k:S.okey}});await c.text()}const a=await rpc('owner_payments');
        el.querySelector('.sheet').innerHTML='<div class="grab"></div><h3>Plus payments</h3>'+(a&&a.length?a.map(x=>`<div class="li" style="align-items:flex-start"><span class="mid"><span class="nm"><span>@${esc(x.username)} · ${esc(x.method)}</span></span><span class="sub">TXN ${esc(x.txn)}${x.note?' · '+esc(x.note):''} · ${new Date(x.created_at).toLocaleDateString()}</span></span>${x.status==='pending'?`<button class="tag g" data-a="payOk" data-v="${x.id}|1">Approve</button><button class="tag" data-a="payOk" data-v="${x.id}|0">Reject</button>`:`<span class="tag">${esc(x.status)}</span>`}</div>`).join(''):'<div class="note2">No requests</div>')}
      catch(e){el.querySelector('.sheet').innerHTML='<div class="grab"></div><div class="note2">Could not load. Unlock owner mode again, then retry.</div>'}},
    payOk:async v=>{const[id,ok]=v.split('|');try{await rpc('owner_payment_decide',{p_id:+id,p_approve:ok==='1',p_days:365});toast(ok==='1'?'Plus turned on for 1 year':'Rejected');ACT.ownerPay()}catch(e){toast('Failed')}},
    ownerRep:async()=>{closeSheet();const el=sheet('Reported posts','<div class="note2">Loading…</div>');
      try{if(S.okey){const c=await sb('/rest/v1/rpc/owner_claim',{m:'POST',b:{k:S.okey}});await c.text()}const a=await rpc('owner_reports');
        el.querySelector('.sheet').innerHTML='<div class="grab"></div><h3>Reported posts</h3>'+(a&&a.length?a.map(x=>`<div class="li" style="align-items:flex-start"><span class="mid"><span class="nm"><span>@${esc(x.username)} · ${x.reports} report${x.reports>1?'s':''}</span></span><span class="sub">${esc(x.body||'(photo)')}</span></span><button class="tag" data-a="repDel" data-v="${x.post_id}">Delete</button><button class="tag g" data-a="repClear" data-v="${x.post_id}">Keep</button></div>`).join(''):'<div class="note2">No reports</div>')}
      catch(e){el.querySelector('.sheet').innerHTML='<div class="grab"></div><div class="note2">Could not load. Unlock owner mode again, then retry.</div>'}},
    repDel:async v=>{try{await rpc('delete_post',{p_post:+v});toast('Deleted');ACT.ownerRep()}catch(e){toast('Failed')}},
    repClear:async v=>{try{await rpc('owner_clear_reports',{p_post:+v});ACT.ownerRep()}catch(e){toast('Failed')}},
    netPlan:v=>{closeSheet();sheet('Badge',A('setPlan',v+'|plus|365','verified','Plus for 1 year')+A('setPlan',v+'|gold|365','verified','Verified (gold) for 1 year')+A('setPlan',v+'|x|0','x','Remove badge'))},
    setPlan:async v=>{const[id,pl,d]=v.split('|');try{await rpc('owner_set_plan',{p_uid:id,p_plan:pl==='x'?null:pl,p_days:+d});toast('Done');closeSheet()}catch(e){toast('Failed')}},
  });
  if(NET.s)setTimeout(netStart,400);
  try{if(SET.secure)Android.secure(true)}catch(e){}
  if(SET.lockOn&&SET.lockH)lockShow();
  try{splash()}catch(e){}
  setTimeout(tabAnim,60);
  loadFeed(true);
  if(ME.name&&SET.bt)setTimeout(()=>Android.start(),300);
}

render();

/* ---------- v4.9 swipe gestures ---------- */
(()=>{let t=null;const W=210;
 const closeAll=ex=>document.querySelectorAll('.srw>.li').forEach(l=>{if(l!==ex&&l.style.transform){l.style.transform='';l._open=false}});
 document.addEventListener('touchstart',e=>{const x=e.touches[0],li=e.target.closest('.srw>.li'),mb=e.target.closest('.mrow .b');
  if(!li)closeAll();
  t=li?{k:'c',el:li,x:x.clientX,y:x.clientY,base:li._open?-W:0}:mb?{k:'m',el:mb.closest('.mrow'),b:mb,x:x.clientX,y:x.clientY,base:0}:null;if(t)t.on=false},{passive:true});
 document.addEventListener('touchmove',e=>{if(!t)return;const x=e.touches[0],dx=x.clientX-t.x,dy=x.clientY-t.y;
  if(!t.on){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){t=null;return}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){t.on=true;t.el.style.transition='none'}else return}
  if(t.k==='c'){const v=Math.max(-W,Math.min(0,t.base+dx));t.el.style.transform='translateX('+v+'px)'}
  else{const v=Math.max(0,Math.min(70,dx));t.el.style.transform='translateX('+v+'px)'}},{passive:true});
 document.addEventListener('touchend',e=>{if(!t)return;const x=e.changedTouches[0],dx=x.clientX-t.x,T=t;t=null;if(!T.on)return;T.el.style.transition='';
  if(T.k==='c'){const open=(T.base+dx)<-W/2;T.el.style.transform=open?'translateX('+(-W)+'px)':'';T.el._open=open;T.el._lp=true;setTimeout(()=>{T.el._lp=false},350)}
  else{T.el.style.transform='';if(dx>55){const id=T.b.dataset.v;if(id&&ACT.replyTo){try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}ACT.replyTo(id)}}}},{passive:true});
})();
</script>
